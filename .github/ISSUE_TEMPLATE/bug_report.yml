name: 🐛 Bug Report
description: File a bug report to help us improve GLASTOR Core
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please check existing issues before submitting.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what happened...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run '...'
        2. Call method '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Error Output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code blocks.
      render: shell

  - type: dropdown
    id: environment
    attributes:
      label: Operating System / Environment
      multiple: false
      options:
        - Linux (Ubuntu/Debian)
        - Linux (Arch/Alpine/Fedora)
        - macOS
        - Windows
        - Container / Docker
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I have searched for existing issues and verified this is not a duplicate.
          required: true
        - label: I have verified that this issue occurs on the latest release/commit.
          required: true
