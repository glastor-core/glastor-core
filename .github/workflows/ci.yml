name: "CI Pipeline"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-and-format:
    name: "Lint, Format, Specter & Vortex AST"
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.vortex.outputs.should-run }}
      execution_mode: ${{ steps.vortex.outputs.execution-mode }}
      matrix: ${{ steps.vortex.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Deno / Node Environment
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Formatting & Lint
        run: |
          if [ -f "deno.json" ] || [ -f "deno.jsonc" ]; then
            deno fmt --check
            deno lint
          elif [ -f "package.json" ]; then
            npm ci || true
            npm run lint --if-present
          else
            echo "No package or deno configuration found, skipping specific linter."
          fi

      - name: Run Specter Polyglot AST API Contract & SemVer Gatekeeper
        id: specter
        uses: glastor-core/specter@v1
        with:
          head-dir: "."
          base-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD~1' }}
          fail-on-trojan: "true"
          output-sarif: "specter-results.sarif"
          output-sbom: "specter-sbom.cdx.json"

      - name: Run Vortex AST Predictive CI & LPT Sharding
        id: vortex
        uses: glastor-core/vortex@v1
        with:
          shards: "2"
          base-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD~1' }}
          head-ref: "HEAD"

  test:
    name: "Test Suite (${{ matrix.shard_id }}/${{ matrix.shard_total }})"
    needs: lint-and-format
    if: needs.lint-and-format.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.lint-and-format.outputs.matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Environment
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Surgical Test Shard
        shell: bash
        env:
          VORTEX_SHARD_FILES: ${{ matrix.test_files }}
        run: |
          if [ -f "deno.json" ] || [ -f "deno.jsonc" ]; then
            read -r -a TEST_FILES <<< "$VORTEX_SHARD_FILES"
            deno test -A "${TEST_FILES[@]}"
          elif [ -f "package.json" ]; then
            npm test --if-present
          else
            echo "Ready for test suite implementation."
          fi
