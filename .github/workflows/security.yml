name: "DevSecOps & Hygiene"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run every Sunday at 02:00 UTC
    - cron: "0 2 * * 0"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: "TruffleHog Secret Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  hygiene-audit:
    name: "Security & Dependency Hygiene"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Audit Toxic Files & Credentials
        run: |
          echo "Scanning for accidental sensitive files..."
          FORBIDDEN_FILES=(".env" ".env.local" "id_rsa" "*.pem" "*.key")
          for file in "${FORBIDDEN_FILES[@]}"; do
            if find . -name "$file" | grep -q .; then
              echo "::error::Found forbidden sensitive file: $file"
              exit 1
            fi
          done
          echo "No forbidden sensitive files detected."
