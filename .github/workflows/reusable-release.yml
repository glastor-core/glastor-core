name: "Reusable Semantic Release & SLSA Provenance"

on:
  workflow_call:
    inputs:
      dry-run:
        description: "Run in dry-run mode without publishing"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  draft-release:
    name: "Draft Semantic Release Notes"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate Release Drafter Notes
        uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
