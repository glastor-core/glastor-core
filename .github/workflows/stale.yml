name: "Manage Stale Issues & PRs"

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Stale Triage
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Issues
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had recent activity.
            It will be closed in 14 days if no further activity occurs. Thank you for your contributions!
          close-issue-message: >
            This issue was closed because it has been stalled for 14 days with no activity.
            Feel free to reopen it or file a new issue if you believe this is still relevant.
          stale-issue-label: "status: stale"
          exempt-issue-labels: "status: pinned,security,rfc,enhancement"

          # Pull Requests
          days-before-pr-stale: 45
          days-before-pr-close: 14
          stale-pr-message: >
            This pull request has been automatically marked as stale due to 45 days of inactivity.
            It will be closed in 14 days if no updates or comments are provided.
          close-pr-message: >
            This pull request was closed due to prolonged inactivity. Thank you for your submission.
          stale-pr-label: "status: stale"
          exempt-pr-labels: "status: pinned,security,work-in-progress"

          # Operations
          operations-per-run: 50
          ascending: true
